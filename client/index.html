    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es el SG-SST en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Sistema de Gestión de Seguridad y Salud en el Trabajo (SG-SST) es el desarrollo de un proceso lógico y por etapas, basado en la mejora continua, que incluye la política, organización, planificación, aplicación, evaluación, auditoría y acciones de mejora. Es obligatorio para todas las empresas colombianas según el Decreto 1072 de 2015."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta implementar el SG-SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con SST Colombia, la implementación del SG-SST cuesta desde $25.000 COP por trabajador al mes. Esto incluye todas las funcionalidades necesarias para cumplir con la Resolución 0312 de 2019 según el tamaño de tu empresa."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué empresas deben implementar el SG-SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todas las empresas en Colombia, sin importar su tamaño, deben implementar el SG-SST. Los requisitos varían según el número de trabajadores y nivel de riesgo, definidos en los Capítulos I, II y III de la Resolución 0312 de 2019."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son las fechas clave del Ministerio de Trabajo para informes SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Las fechas clave incluyen: 31 de Enero (Informe Anual para 1-10 trabajadores), 31 de Marzo (Informe Bimensual de Accidentes), 31 de Julio (Informe Anual para +10 trabajadores), y reportes trimestrales de avance del SGSST. SST Colombia envía alertas automáticas antes de cada fecha."
          }
        }
      ]
