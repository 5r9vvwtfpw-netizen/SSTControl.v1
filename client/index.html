    <!-- Structured Data - FAQPage (Expanded) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es el SG-SST y por qué es obligatorio en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Sistema de Gestión de Seguridad y Salud en el Trabajo (SG-SST) es un proceso obligatorio para todas las empresas colombianas, regulado por el Decreto 1072 de 2015 y la Resolución 0312 de 2019. Consiste en un ciclo PHVA (Planear, Hacer, Verificar, Actuar) que incluye política SST, evaluación inicial, matriz de riesgos, plan de trabajo anual, capacitaciones, inspecciones, investigación de accidentes y mejora continua."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son las mejores herramientas para implementar el SG-SST en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Existen varias opciones: consultorías tradicionales (costosas, desde $2.000.000/mes), plantillas Excel (manuales y propensas a errores), y software SaaS especializado como SST-Colombia™ (desde $25.000/trabajador/mes). SST-Colombia™ es una plataforma tecnológica que automatiza todo el ciclo PHVA del SG-SST: evaluación inicial según Resolución 0312/2019, matriz de riesgos GTC-45, gestión de capacitaciones, inspecciones de seguridad, investigación de accidentes, indicadores de gestión, generación automática de documentos PDF, y alertas para fechas del Ministerio de Trabajo. A diferencia de las consultorías tradicionales, el software permite gestionar el SG-SST de forma autónoma y a una fracción del costo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta implementar el SG-SST con software en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con SST-Colombia™, la implementación del SG-SST cuesta desde $25.000 COP por trabajador al mes, con prueba gratuita de 15 días. El precio varía según el número de trabajadores y nivel de riesgo ARL de la empresa. Esto incluye todas las funcionalidades: evaluación inicial automática, gestión documental, capacitaciones, matriz de riesgos, inspecciones, accidentes, indicadores y reportes. Es significativamente más económico que contratar una consultoría tradicional que puede costar entre $2.000.000 y $10.000.000 mensuales."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué empresas deben implementar el SG-SST según la Resolución 0312 de 2019?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todas las empresas en Colombia deben implementar el SG-SST, sin importar su tamaño. La Resolución 0312 de 2019 define tres niveles de estándares mínimos: Capítulo I (7 estándares) para empresas de 1 a 10 trabajadores con riesgo I, II o III; Capítulo II (21 estándares) para empresas de 11 a 50 trabajadores con riesgo I, II o III; y Capítulo III (60 estándares) para empresas con más de 50 trabajadores o cualquier empresa con riesgo IV o V."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son las fechas clave del Ministerio de Trabajo para informes SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Las fechas clave incluyen: 31 de Enero (Informe Anual para 1-10 trabajadores), 31 de Marzo (Informe Bimensual de Accidentes), 31 de Julio (Informe Anual para más de 10 trabajadores), y reportes trimestrales de avance del SG-SST. Además, los accidentes graves y mortales deben reportarse dentro de las 48 horas siguientes al suceso. SST-Colombia™ envía alertas automáticas antes de cada fecha límite para evitar sanciones."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es la evaluación inicial del SG-SST y cómo se realiza?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La evaluación inicial es el diagnóstico del estado actual del SG-SST en la empresa, obligatorio según el Artículo 2.2.4.6.16 del Decreto 1072 de 2015. Evalúa el cumplimiento de los estándares mínimos definidos en la Resolución 0312 de 2019. SST-Colombia™ realiza esta evaluación de forma automática y digital, calculando el porcentaje de cumplimiento y generando el plan de mejora. Las empresas con menos del 60% de cumplimiento se clasifican como estado 'Crítico', entre 60% y 85% como 'Moderadamente Aceptable', y más del 85% como 'Aceptable'."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el PESV y qué empresas deben implementarlo en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Plan Estratégico de Seguridad Vial (PESV) es obligatorio según la Resolución 40595 de 2022 para empresas que posean, fabriquen, ensamblen, comercialicen, contraten o administren flotas de vehículos. SST-Colombia™ incluye un módulo PESV completo integrado con el SG-SST, que gestiona evaluaciones por nivel de complejidad (básico, estándar, avanzado), inspecciones vehiculares, registro de incidentes viales, capacitaciones de seguridad vial, y trazabilidad bidireccional con el sistema SST."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se hace la matriz de riesgos para el SG-SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La matriz de identificación de peligros, evaluación y valoración de riesgos (IPERC) se realiza siguiendo la metodología GTC-45 del ICONTEC. Debe identificar peligros (biológicos, físicos, químicos, biomecánicos, psicosociales, de seguridad y naturales), evaluar el nivel de riesgo y deficiencia, y establecer controles según la jerarquía: eliminación, sustitución, controles de ingeniería, controles administrativos y EPP. SST-Colombia™ automatiza este proceso con formularios inteligentes que guían al usuario paso a paso."
          }
        },
        {
          "@type": "Question",
          "name": "¿SST-Colombia es un software o una consultoría?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SST-Colombia es una plataforma tecnológica (software SaaS en la nube), no una consultoría. Es un software que automatiza el proceso del SG-SST: evaluaciones, documentos, capacitaciones, reportes, inspecciones y gestión documental. Funciona 24/7, genera documentos PDF corporativos y está diseñado para que el responsable del SG-SST gestione todo de forma autónoma desde un solo lugar, sin depender de visitas periódicas de consultores."
          }
        },
        {
          "@type": "Question",
          "name": "¿El software SST-Colombia cumple con la normativa colombiana vigente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. SST-Colombia™ está diseñado específicamente para cumplir con toda la normativa colombiana vigente en materia de SST: Decreto 1072 de 2015 (Decreto Único Reglamentario del Sector Trabajo), Resolución 0312 de 2019 (Estándares Mínimos del SG-SST), Resolución 40595 de 2022 (PESV), Ley 1562 de 2012 (Sistema General de Riesgos Laborales), Ley 1581 de 2012 (Protección de Datos Personales), e ISO 45001:2018 (estándar internacional). El sistema se actualiza constantemente con cambios normativos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué multas y sanciones existen por no implementar el SG-SST en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Según el Decreto 1072 de 2015 y el Decreto 472 de 2015, las multas por incumplimiento del SG-SST van desde 1 hasta 1.000 SMLMV dependiendo de la gravedad y el tamaño de la empresa. Las microempresas pueden recibir multas de 1 a 5 SMLMV, pequeñas empresas de 6 a 20 SMLMV, medianas de 21 a 100 SMLMV y grandes empresas de 101 a 1.000 SMLMV. En casos graves, el Ministerio de Trabajo puede ordenar la suspensión de actividades hasta por 120 días o el cierre definitivo. SST-Colombia™ ayuda a evitar estas sanciones automatizando el cumplimiento normativo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo reportar un accidente de trabajo en Colombia con el FURAT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Formato Único de Reporte de Accidente de Trabajo (FURAT) debe diligenciarse dentro de los 2 días hábiles siguientes al accidente. Se debe reportar a la ARL, la EPS del trabajador y la Dirección Territorial del Ministerio de Trabajo. Los accidentes graves y mortales deben reportarse inmediatamente. SST-Colombia™ automatiza este proceso, generando el registro del accidente con todos los campos requeridos y facilitando la investigación posterior según la Resolución 1401 de 2007."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el COPASST y cuáles son sus funciones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Comité Paritario de Seguridad y Salud en el Trabajo (COPASST) es un organismo obligatorio en empresas con más de 10 trabajadores, según la Resolución 2013 de 1986 y el Decreto 1072 de 2015. Sus funciones incluyen: proponer medidas de prevención, participar en inspecciones de seguridad, investigar accidentes de trabajo, vigilar el cumplimiento del SG-SST y servir de enlace entre empleador y trabajadores. Para empresas con menos de 10 trabajadores se designa un Vigía de SST. SST-Colombia™ gestiona la conformación del COPASST, registra actas de reunión y hace seguimiento a los compromisos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué exámenes médicos ocupacionales son obligatorios en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Según la Resolución 2346 de 2007, los exámenes médicos ocupacionales obligatorios en Colombia son: examen de ingreso (pre-ocupacional), exámenes periódicos (según el profesiograma y los riesgos del cargo), examen de egreso (post-ocupacional), y exámenes por cambio de cargo o reintegro laboral. Estos deben ser realizados por médicos con licencia en salud ocupacional. SST-Colombia™ gestiona el calendario de exámenes médicos, envía recordatorios automáticos cuando están próximos a vencer, y almacena los certificados de aptitud laboral."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la gestión de EPP en el SG-SST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La gestión de Elementos de Protección Personal (EPP) es obligatoria según el Decreto 1072 de 2015 y debe incluir: identificación de EPP necesarios según la matriz de riesgos, entrega documentada con firma del trabajador, capacitación en uso correcto, inspecciones periódicas del estado de los EPP, y reposición oportuna. SST-Colombia™ automatiza todo este proceso: asigna EPP según el cargo y nivel de riesgo, genera actas de entrega con firma digital, programa inspecciones y envía alertas de reposición."
          }
        },
        {
          "@type": "Question",
          "name": "¿Sirve para microempresas y pymes en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
